<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Law Practice Console{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
  <script>
    // Error messages arrive with HX-Retarget: #flash. htmx skips error responses by
    // default, so let those through; clear the old message when a new request starts.
    document.addEventListener("htmx:beforeSwap", function (e) {
      if (e.detail.xhr.status >= 400 && e.detail.xhr.getResponseHeader("HX-Retarget")) {
        e.detail.shouldSwap = true;
        e.detail.isError = false;
      }
    });
    document.addEventListener("htmx:beforeRequest", function () {
      var flash = document.getElementById("flash");
      if (flash) flash.innerHTML = "";
    });
  </script>
</head>
<body x-data="{ palette: false }"
      @keydown.window.ctrl.k.prevent="palette = true; $nextTick(() => $refs.q.focus())"
      @keydown.window.escape="palette = false">
  <header class="topbar">
    <a class="brand" href="/">Law Practice Console</a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/matters/new">New matter</a>
      <button class="link" @click="palette = true; $nextTick(() => $refs.q.focus())">Search <kbd>Ctrl K</kbd></button>
    </nav>
  </header>

  <div id="flash" aria-live="polite"></div>
  <main>{% block content %}{% endblock %}</main>

  <div class="palette" x-show="palette" x-cloak @click.self="palette = false">
    <div class="palette-box">
      <input x-ref="q" name="q" type="search" placeholder="Search every document..."
             hx-get="/search" hx-trigger="input changed delay:250ms, search" hx-target="#palette-results">
      <div id="palette-results"></div>
    </div>
  </div>
  <footer class="foot">v{{ version }} · data stays on this machine</footer>
</body>
</html>
