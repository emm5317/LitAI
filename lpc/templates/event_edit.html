{% extends "base.html" %}
{% block title %}{{ e.event_code }} · {{ m.short_name }}{% endblock %}
{% block content %}
<form class="card form" method="post" action="/events/{{ e.id }}/edit">
  <p class="muted small"><a href="/matters/{{ m.id }}">{{ m.short_name }}</a> · <a href="/matters/{{ m.id }}/chronology">Chronology</a></p>
  <h2>Edit {{ e.event_code }}</h2>
  {% set v = e %}
  {% include "partials/event_form.html" %}
  <button class="primary" type="submit">Save</button> &nbsp; <a href="/matters/{{ m.id }}/chronology#{{ e.event_code }}">Cancel</a>
</form>
<form method="post" action="/events/{{ e.id }}/delete" onsubmit="return confirm('Delete {{ e.event_code }}? This cannot be undone.')">
  <button type="submit" class="link">Delete this event</button>
</form>
{% endblock %}
