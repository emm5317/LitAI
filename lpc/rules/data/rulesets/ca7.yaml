# U.S. Court of Appeals for the Seventh Circuit: Circuit Rules + FRAP.
id: ca7
name: Seventh Circuit (Circuit Rules + FRAP)
jurisdiction: federal
counting: frcp6a
holidays:
  all: [federal]
  forward_only: [illinois]   # clerk's principal office is in Chicago (FRAP 26(a)(6)(C))
base: [frap]
sources: [ca7_rules, ca7_handbook]
verified: false
entries:
  - id: ca7.docketing_statement
    title: Appellant's docketing statement (if not filed with the notice of appeal)
    cite: 7th Cir. R. 3(c)(1)
    trigger: notice of appeal filed
    period: {days: 7}
    notes: Counsel is fined if it is not filed within 14 days; the appeal is treated as abandoned at 28 days (Cir. R. 3(c)(2)).
  - id: ca7.docketing_statement_appellee
    title: Appellee's complete docketing statement (if appellant's is incomplete or wrong)
    cite: 7th Cir. R. 3(c)(1)
    trigger: appellant's docketing statement filed
    period: {days: 14}
  - id: ca7.docketing_fee
    title: Pay docketing fee (appeal docketed without prepayment)
    cite: 7th Cir. R. 3(b)
    trigger: appeal docketed
    period: {days: 14}
  - id: ca7.transcript_information_sheet
    title: Transcript information sheet
    cite: 7th Cir. R. 10(c)
    trigger: notice of appeal filed
    period: {days: 14}
    notes: Verify the trigger and period against the current Circuit Rules.
