[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "law-practice-console"
version = "0.1.0"
description = "Local-first litigation console: matters, deadlines, documents, research and drafting."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "keyring>=25",
    "extract-msg>=0.48",          # Outlook .msg emails
    "python-docx>=1.1",           # Word exports (chronology, depo outlines)
    "openpyxl>=3.1",              # Excel export (and, later, workbook import)
]

[project.optional-dependencies]
desktop = ["pywebview>=5.1"]
dev = ["pytest>=8", "pyinstaller>=6.6"]

[project.scripts]
lpc = "lpc.__main__:main"

[tool.setuptools.packages.find]
include = ["lpc*"]

[tool.setuptools.package-data]
lpc = [
    "migrations/*.sql",
    "templates/*.html",
    "templates/partials/*.html",
    "static/*",
    "static/vendor/*",
    "rules/data/*.yaml",
    "rules/data/rulesets/*.yaml",
    "rules/sources.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
